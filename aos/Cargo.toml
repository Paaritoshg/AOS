[package]
name = "aos"
version = "0.1.0"
edition = "2021"
description = "Agent Operating System - A runtime for AI agents with deterministic enforcement boundaries"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
tracing = "0.1"
async-trait = "0.1"

[lib]
name = "aos"
path = "src/lib.rs"
